name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pesa
          POSTGRES_PASSWORD: pesa
          POSTGRES_DB: pesa_match_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: cd apps/backend && npx prisma generate
      - run: cd apps/backend && DATABASE_URL="postgresql://pesa:pesa@localhost:5432/pesa_match_test?schema=public" npx prisma migrate deploy
      - run: npm run lint -w apps/backend
      - run: npm run build -w apps/backend
      - run: npm run test -w apps/backend
      - run: DATABASE_URL="postgresql://pesa:pesa@localhost:5432/pesa_match_test?schema=public" JWT_ACCESS_SECRET="ci-test-secret-at-least-32-characters-long!!" CORS_ORIGINS="http://localhost:3000" npm run test:e2e -w apps/backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: npm run lint -w apps/frontend
      - run: npm run typecheck -w apps/frontend
      - run: npm run build -w apps/frontend
